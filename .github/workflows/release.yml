name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: msys2 {0}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)." >&2
            exit 1
          fi

      - name: Clone QEMU
        shell: msys2 {0}
        run: git clone --depth 1 --branch v11.1.0 https://gitlab.com/qemu-project/qemu.git ../qemu

      - name: Build QEMU
        shell: msys2 {0}
        run: bash scripts/build_qemu.sh ../qemu

      - name: Build the release zip
        shell: msys2 {0}
        run: bash scripts/build_release.sh ../qemu

      - uses: actions/upload-artifact@v4
        with:
          name: keysoft-emu
          path: dist/keysoft-emu-*.zip

      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/keysoft-emu-*.zip --draft --title "${GITHUB_REF_NAME#v}"
